semver = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
kiana-ai = { workspace = true }
kiana-agent-core = { workspace = true }
kiana-core = { workspace = true }
kiana-session-core = { workspace = true }
kiana-config = { workspace = true }
kiana-permissions = { workspace = true }
kiana-theme = { workspace = true }
kiana-ext-api = { workspace = true }
kiana-extensions = { workspace = true }
kiana-tui = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
notify = { workspace = true }
kiana-json = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
